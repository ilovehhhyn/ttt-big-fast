[project]
name = "ttt-big-fast"
version = "0.1.0"
description = "Big fast weights, small slow weights: meta-learned LoRA for end-to-end test-time training"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.6",
  "transformers>=4.45",
  "safetensors>=0.4",
  "huggingface_hub>=0.25",
  "datasets>=3.0",
  "numpy>=2.0",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "wandb>=0.19",
  "tqdm>=4.67",
  "einops>=0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.setuptools.packages.find]
include = ["ttt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
